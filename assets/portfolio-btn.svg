<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 56" width="100%" height="100%">
  <defs>
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseBtn {
      0%, 100% { filter: drop-shadow(0 0 4px #00f0ff); }
      50% { filter: drop-shadow(0 0 12px #8b5cf6); }
    }
    .btn-frame { animation: pulseBtn 3s infinite ease-in-out; }
  </style>

  <!-- Button Frame -->
  <rect class="btn-frame" x="2" y="2" width="356" height="52" rx="26" fill="#080e1c" stroke="url(#btnBg)" stroke-width="2" />
  
  <!-- Subtle inner background highlight -->
  <rect x="4" y="4" width="352" height="48" rx="24" fill="rgba(0, 240, 255, 0.05)" />

  <!-- Hexagon Icon -->
  <polygon points="40,20 48,24 48,32 40,36 32,32 32,24" fill="none" stroke="#00f0ff" stroke-width="1.8" />
  <circle cx="40" cy="28" r="2.5" fill="#00ff88" />

  <!-- Button Text -->
  <text x="58" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">
    LAUNCH 3D NEURAL PORTFOLIO
  </text>
  <text x="318" y="32" fill="#00ff88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900">
    ➔
  </text>
</svg>
