<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914" />
      <stop offset="50%" stop-color="#0b1226" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <linearGradient id="glowBorder5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <filter id="glowCard5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cardScan5 {
      0% { transform: translateY(-10px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(260px); opacity: 0; }
    }
    .scanner-line5 { animation: cardScan5 4.8s infinite ease-in-out; }
  </style>

  <rect width="500" height="250" rx="10" fill="url(#cardBg5)" stroke="url(#glowBorder5)" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <path d="M 2 16 L 2 2 L 16 2" fill="none" stroke="#f59e0b" stroke-width="3" />
  <path d="M 484 2 L 498 2 L 498 16" fill="none" stroke="#f59e0b" stroke-width="3" />
  <path d="M 2 234 L 2 248 L 16 248" fill="none" stroke="#ef4444" stroke-width="3" />
  <path d="M 484 248 L 498 248 L 498 234" fill="none" stroke="#ef4444" stroke-width="3" />

  <line class="scanner-line5" x1="2" y1="0" x2="498" y2="0" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />

  <g transform="translate(20, 20)">
    <text x="0" y="12" fill="#fbbf24" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="1">
      PRJ-05 // ANOMALY_DETECTION_ENGINE
    </text>

    <g transform="translate(340, -4)">
      <rect width="120" height="20" rx="4" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
      <circle cx="10" cy="10" r="3" fill="#f59e0b" />
      <text x="20" y="13" fill="#fbbf24" font-family="'Courier New', monospace" font-size="9" font-weight="700">ACTIVE [PROD]</text>
    </g>
  </g>

  <text x="20" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">
    Risk Management AI
  </text>

  <text x="20" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    Predictive financial &amp; operational anomaly detection system.
  </text>
  <text x="20" y="120" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
    Monitors transactions for irregular variances using XGBoost &amp; Scikit-Learn.
  </text>

  <g transform="translate(20, 145)">
    <rect x="0" y="0" width="60" height="20" rx="3" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="0.8" />
    <text x="30" y="13" text-anchor="middle" fill="#00f0ff" font-family="'Courier New', monospace" font-size="9" font-weight="700">Python</text>

    <rect x="68" y="0" width="85" height="20" rx="3" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="0.8" />
    <text x="110" y="13" text-anchor="middle" fill="#fbbf24" font-family="'Courier New', monospace" font-size="9" font-weight="700">Scikit-Learn</text>

    <rect x="161" y="0" width="65" height="20" rx="3" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="0.8" />
    <text x="193" y="13" text-anchor="middle" fill="#f87171" font-family="'Courier New', monospace" font-size="9" font-weight="700">XGBoost</text>

    <rect x="234" y="0" width="60" height="20" rx="3" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8" />
    <text x="264" y="13" text-anchor="middle" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9" font-weight="700">Pandas</text>

    <rect x="302" y="0" width="70" height="20" rx="3" fill="rgba(255, 75, 75, 0.1)" stroke="rgba(255, 75, 75, 0.3)" stroke-width="0.8" />
    <text x="337" y="13" text-anchor="middle" fill="#ff4b4b" font-family="'Courier New', monospace" font-size="9" font-weight="700">Streamlit</text>
  </g>

  <g transform="translate(20, 195)">
    <line x1="0" y1="0" x2="460" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <g transform="translate(0, 12)">
      <rect width="150" height="28" rx="5" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1" />
      <text x="75" y="18" text-anchor="middle" fill="#fbbf24" font-family="'Courier New', monospace" font-size="10" font-weight="800">
        OPEN SOURCE ➔
      </text>
    </g>
    <text x="460" y="30" text-anchor="end" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="10">
      ANOMALY DETECTION // RISK RATIO 0.02
    </text>
  </g>
</svg>
