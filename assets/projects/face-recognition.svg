<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914" />
      <stop offset="50%" stop-color="#0b1226" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <linearGradient id="glowBorder2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <filter id="glowCard2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cardScan2 {
      0% { transform: translateY(-10px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(260px); opacity: 0; }
    }
    .scanner-line2 { animation: cardScan2 5.5s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="500" height="250" rx="10" fill="url(#cardBg2)" stroke="url(#glowBorder2)" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <path d="M 2 16 L 2 2 L 16 2" fill="none" stroke="#8b5cf6" stroke-width="3" />
  <path d="M 484 2 L 498 2 L 498 16" fill="none" stroke="#8b5cf6" stroke-width="3" />
  <path d="M 2 234 L 2 248 L 16 248" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 484 248 L 498 248 L 498 234" fill="none" stroke="#00f0ff" stroke-width="3" />

  <!-- Scan Beam -->
  <line class="scanner-line2" x1="2" y1="0" x2="498" y2="0" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" />

  <!-- Top Status &amp; ID Bar -->
  <g transform="translate(20, 20)">
    <text x="0" y="12" fill="#c084fc" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="1">
      PRJ-02 // BIOMETRIC_SURVEILLANCE
    </text>

    <!-- Status Badge -->
    <g transform="translate(340, -4)">
      <rect width="120" height="20" rx="4" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
      <circle cx="10" cy="10" r="3" fill="#00f0ff" />
      <text x="20" y="13" fill="#00f0ff" font-family="'Courier New', monospace" font-size="9" font-weight="700">COMPLETED</text>
    </g>
  </g>

  <!-- Project Name -->
  <text x="20" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">
    Face Recognition System
  </text>

  <!-- Tagline / Description -->
  <text x="20" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    High-speed biometric surveillance &amp; identification framework.
  </text>
  <text x="20" y="120" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
    Anti-spoofing liveness verification, multi-face tracking &amp; 128D embeddings.
  </text>

  <!-- Tech Stack Chips -->
  <g transform="translate(20, 145)">
    <rect x="0" y="0" width="60" height="20" rx="3" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="0.8" />
    <text x="30" y="13" text-anchor="middle" fill="#00f0ff" font-family="'Courier New', monospace" font-size="9" font-weight="700">Python</text>

    <rect x="68" y="0" width="65" height="20" rx="3" fill="rgba(139, 92, 246, 0.1)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="0.8" />
    <text x="100" y="13" text-anchor="middle" fill="#c084fc" font-family="'Courier New', monospace" font-size="9" font-weight="700">OpenCV</text>

    <rect x="141" y="0" width="105" height="20" rx="3" fill="rgba(244, 63, 94, 0.1)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="0.8" />
    <text x="193" y="13" text-anchor="middle" fill="#fb7185" font-family="'Courier New', monospace" font-size="9" font-weight="700">Face_Recognition</text>

    <rect x="254" y="0" width="60" height="20" rx="3" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8" />
    <text x="284" y="13" text-anchor="middle" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9" font-weight="700">NumPy</text>

    <rect x="322" y="0" width="60" height="20" rx="3" fill="rgba(0, 255, 136, 0.1)" stroke="rgba(0, 255, 136, 0.3)" stroke-width="0.8" />
    <text x="352" y="13" text-anchor="middle" fill="#00ff88" font-family="'Courier New', monospace" font-size="9" font-weight="700">SQLite</text>
  </g>

  <!-- Bottom Action Section -->
  <g transform="translate(20, 195)">
    <line x1="0" y1="0" x2="460" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Open Source Button -->
    <g transform="translate(0, 12)">
      <rect width="150" height="28" rx="5" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="1" />
      <text x="75" y="18" text-anchor="middle" fill="#c084fc" font-family="'Courier New', monospace" font-size="10" font-weight="800">
        OPEN SOURCE ➔
      </text>
    </g>

    <!-- Metric Marker -->
    <text x="460" y="30" text-anchor="end" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="10">
      LATENCY: &lt;85ms // 60 FPS STREAM
    </text>
  </g>
</svg>
