<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <filter id="glowPipe" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes movePacket1 {
      0% { cx: 160px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 240px; opacity: 0; }
    }
    @keyframes movePacket2 {
      0% { cx: 370px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 450px; opacity: 0; }
    }
    @keyframes movePacket3 {
      0% { cx: 580px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 660px; opacity: 0; }
    }
    @keyframes movePacket4 {
      0% { cx: 790px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 870px; opacity: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }

    .p1 { animation: movePacket1 2.2s infinite linear; }
    .p2 { animation: movePacket2 2.2s infinite linear 0.55s; }
    .p3 { animation: movePacket3 2.2s infinite linear 1.1s; }
    .p4 { animation: movePacket4 2.2s infinite linear 1.65s; }
    .node-box { animation: nodePulse 3s infinite ease-in-out; }
  </style>

  <!-- Container -->
  <rect width="1000" height="160" rx="10" fill="url(#pipeBg)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2" />
  
  <!-- Title Top Header -->
  <text x="30" y="24" fill="#00f0ff" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="2">
    // NEURAL COMPUTATION PIPELINE :: REAL-TIME DATA STREAM
  </text>
  <text x="970" y="24" text-anchor="end" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
    LATENCY: 8.4ms // BUS: 128-BIT
  </text>

  <!-- Connection Bus Lines -->
  <line x1="160" y1="85" x2="240" y2="85" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="370" y1="85" x2="450" y2="85" stroke="rgba(139, 92, 246, 0.4)" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="580" y1="85" x2="660" y2="85" stroke="rgba(139, 92, 246, 0.4)" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="790" y1="85" x2="870" y2="85" stroke="rgba(0, 255, 136, 0.4)" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Animated Moving Data Packets -->
  <circle class="p1" cx="160" cy="85" r="3.5" fill="#00f0ff" filter="url(#glowPipe)" />
  <circle class="p2" cx="370" cy="85" r="3.5" fill="#c084fc" filter="url(#glowPipe)" />
  <circle class="p3" cx="580" cy="85" r="3.5" fill="#c084fc" filter="url(#glowPipe)" />
  <circle class="p4" cx="790" cy="85" r="3.5" fill="#00ff88" filter="url(#glowPipe)" />

  <!-- Node 1: INPUT -->
  <g transform="translate(30, 50)">
    <rect class="node-box" width="130" height="70" rx="6" fill="rgba(0, 240, 255, 0.05)" stroke="#00f0ff" stroke-width="1.5" />
    <text x="65" y="24" text-anchor="middle" fill="#94a3b8" font-family="'Courier New', monospace" font-size="9" font-weight="700">STAGE 01</text>
    <text x="65" y="44" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800">RAW INPUT</text>
    <text x="65" y="60" text-anchor="middle" fill="#00f0ff" font-family="'Courier New', monospace" font-size="9">Sensors &amp; Video</text>
  </g>

  <!-- Node 2: PREPROCESSING -->
  <g transform="translate(240, 50)">
    <rect class="node-box" width="130" height="70" rx="6" fill="rgba(0, 240, 255, 0.05)" stroke="#00f0ff" stroke-width="1.5" />
    <text x="65" y="24" text-anchor="middle" fill="#94a3b8" font-family="'Courier New', monospace" font-size="9" font-weight="700">STAGE 02</text>
    <text x="65" y="44" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="800">PROCESSING</text>
    <text x="65" y="60" text-anchor="middle" fill="#00f0ff" font-family="'Courier New', monospace" font-size="9">Tensors &amp; Vectors</text>
  </g>

  <!-- Node 3: NEURAL MODEL (Central Highlight) -->
  <g transform="translate(450, 45)">
    <rect class="node-box" width="130" height="80" rx="6" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="65" cy="18" r="4" fill="#a855f7" filter="url(#glowPipe)" />
    <text x="65" y="36" text-anchor="middle" fill="#c084fc" font-family="'Courier New', monospace" font-size="9" font-weight="700">CORE 03</text>
    <text x="65" y="55" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800">AI MODEL</text>
    <text x="65" y="71" text-anchor="middle" fill="#a78bfa" font-family="'Courier New', monospace" font-size="9">CNN &amp; Embeddings</text>
  </g>

  <!-- Node 4: INFERENCE ENGINE -->
  <g transform="translate(660, 50)">
    <rect class="node-box" width="130" height="70" rx="6" fill="rgba(139, 92, 246, 0.05)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="65" y="24" text-anchor="middle" fill="#94a3b8" font-family="'Courier New', monospace" font-size="9" font-weight="700">STAGE 04</text>
    <text x="65" y="44" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="800">INFERENCE</text>
    <text x="65" y="60" text-anchor="middle" fill="#c084fc" font-family="'Courier New', monospace" font-size="9">High-Speed Eval</text>
  </g>

  <!-- Node 5: OUTPUT / ACTION -->
  <g transform="translate(870, 50)">
    <rect class="node-box" width="100" height="70" rx="6" fill="rgba(0, 255, 136, 0.08)" stroke="#00ff88" stroke-width="1.8" />
    <text x="50" y="24" text-anchor="middle" fill="#94a3b8" font-family="'Courier New', monospace" font-size="9" font-weight="700">STAGE 05</text>
    <text x="50" y="44" text-anchor="middle" fill="#00ff88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800">OUTPUT</text>
    <text x="50" y="60" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="9">Real-Time Action</text>
  </g>

  <!-- Bottom Telemetry Ticker -->
  <text x="500" y="146" text-anchor="middle" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="9" letter-spacing="1">
    PIPELINE STATUS: FULLY SYNCHRONOUS // ZERO BUFFER OVERFLOW // REENTRANT SAFE
  </text>
</svg>
