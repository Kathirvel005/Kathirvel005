<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>

    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-cursor { animation: termBlink 1s infinite; }
  </style>

  <!-- Frame -->
  <rect width="1000" height="200" rx="10" fill="url(#termBg)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" />
  
  <!-- Title bar -->
  <rect width="1000" height="30" rx="10" fill="rgba(255, 255, 255, 0.03)" />
  <line x1="0" y1="30" x2="1000" y2="30" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1" />
  
  <circle cx="20" cy="15" r="4" fill="#ef4444" opacity="0.8" />
  <circle cx="34" cy="15" r="4" fill="#eab308" opacity="0.8" />
  <circle cx="48" cy="15" r="4" fill="#10b981" opacity="0.8" />
  
  <text x="500" y="20" text-anchor="middle" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="1">
    BASH_SESSION // KATHIRVEL_AI_COMMAND_PROMPT
  </text>

  <!-- Terminal Content -->
  <g transform="translate(30, 56)">
    <!-- Line 1: whoami -->
    <text x="0" y="16" fill="#00ff88" font-family="'Courier New', monospace" font-size="13" font-weight="700">$ whoami</text>
    <text x="120" y="16" fill="#ffffff" font-family="'Courier New', monospace" font-size="13" font-weight="700">Kathirvel T.</text>
    <text x="260" y="16" fill="#00f0ff" font-family="'Courier New', monospace" font-size="12">[B.Tech Artificial Intelligence &amp; Data Science]</text>

    <!-- Line 2: role -->
    <text x="0" y="44" fill="#00ff88" font-family="'Courier New', monospace" font-size="13" font-weight="700">$ role</text>
    <text x="120" y="44" fill="#c084fc" font-family="'Courier New', monospace" font-size="13" font-weight="600">AI Developer | Python Programmer | Robotics Enthusiast</text>

    <!-- Line 3: focus -->
    <text x="0" y="72" fill="#00ff88" font-family="'Courier New', monospace" font-size="13" font-weight="700">$ focus</text>
    <text x="120" y="72" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="12">AI • Machine Learning • Computer Vision • Full Stack (Spring Boot / React) • Robotics</text>

    <!-- Line 4: mission &amp; prompt cursor -->
    <text x="0" y="100" fill="#00ff88" font-family="'Courier New', monospace" font-size="13" font-weight="700">$ mission</text>
    <text x="120" y="100" fill="#00ff88" font-family="'Courier New', monospace" font-size="12" font-weight="600">
      "Build intelligent systems that create real-world impact."<tspan class="term-cursor" fill="#00f0ff">_</tspan>
    </text>
  </g>
</svg>
