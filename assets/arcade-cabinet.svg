<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="560">
  <defs>
    <!-- Cyberpunk Arcade Gradients -->
    <linearGradient id="cab-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f1a3a" />
      <stop offset="100%" stop-color="#0a0815" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#08668a" />
    </linearGradient>
    <linearGradient id="neon-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#9d004c" />
    </linearGradient>
    <linearGradient id="marquee-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a17" />
      <stop offset="50%" stop-color="#1a1438" />
      <stop offset="100%" stop-color="#05040a" />
    </linearGradient>
    <linearGradient id="bezel-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f1c" />
      <stop offset="100%" stop-color="#05050a" />
    </linearGradient>

    <!-- Neon Glow Effects -->
    <filter id="glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-y" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanline Pattern for CRT Screen Overlay -->
    <pattern id="crt-scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25" />
    </pattern>

    <!-- Rounded Screen Clip -->
    <clipPath id="screen-clip">
      <rect x="75" y="70" width="700" height="280" rx="15" />
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Share+Tech+Mono&amp;display=swap');
    
    .retro-font {
      font-family: 'Press Start 2P', monospace;
      fill: #FFFFFF;
    }
    
    .tech-font {
      font-family: 'Share Tech Mono', monospace;
      fill: #00FF88;
      letter-spacing: 1px;
    }

    .neon-text-pink {
      fill: #FF007F;
      filter: url(#glow-p);
    }
    
    .neon-text-cyan {
      fill: #00D9FF;
      filter: url(#glow-c);
    }

    @keyframes text-flicker {
      0%, 100% { opacity: 1; }
      49% { opacity: 1; }
      50% { opacity: 0; }
      99% { opacity: 0; }
    }

    @keyframes neon-pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 5px #00D9FF); }
    }

    @keyframes marquee-glow {
      0%, 100% { filter: drop-shadow(0 0 2px #FF007F); }
      50% { filter: drop-shadow(0 0 10px #FF007F); }
    }

    .blink {
      animation: text-flicker 1.2s infinite;
    }

    .pulse-neon {
      animation: neon-pulse 2s ease-in-out infinite;
    }

    .glow-marquee {
      animation: marquee-glow 3s ease-in-out infinite;
    }
  </style>

  <!-- ==================== MAIN CABINET STRUCTURE ==================== -->
  
  <!-- Outer Side Wings (Left & Right Cabinet Sides) -->
  <polygon points="10,10 65,10 65,550 10,550" fill="url(#cab-side)" stroke="#FF007F" stroke-width="1.5" opacity="0.9" />
  <polygon points="785,10 840,10 840,550 785,550" fill="url(#cab-side)" stroke="#FF007F" stroke-width="1.5" opacity="0.9" />

  <!-- Left Side Art (Cyberpunk Details) -->
  <path d="M 20,40 L 55,100 L 55,480 L 20,520 Z" fill="#0f091c" />
  <line x1="30" y1="60" x2="30" y2="480" stroke="#00D9FF" stroke-width="1.5" opacity="0.4" />
  <line x1="45" y1="80" x2="45" y2="460" stroke="#FF007F" stroke-width="1.5" opacity="0.4" />
  <!-- Diagonal stripes -->
  <line x1="20" y1="150" x2="55" y2="185" stroke="#8B5CF6" stroke-width="2" opacity="0.6" />
  <line x1="20" y1="250" x2="55" y2="285" stroke="#8B5CF6" stroke-width="2" opacity="0.6" />
  <line x1="20" y1="350" x2="55" y2="385" stroke="#8B5CF6" stroke-width="2" opacity="0.6" />

  <!-- Right Side Art (Cyberpunk Details) -->
  <path d="M 830,40 L 795,100 L 795,480 L 830,520 Z" fill="#0f091c" />
  <line x1="820" y1="60" x2="820" y2="480" stroke="#00D9FF" stroke-width="1.5" opacity="0.4" />
  <line x1="805" y1="80" x2="805" y2="460" stroke="#FF007F" stroke-width="1.5" opacity="0.4" />
  <!-- Diagonal stripes -->
  <line x1="830" y1="150" x2="795" y2="185" stroke="#8B5CF6" stroke-width="2" opacity="0.6" />
  <line x1="830" y1="250" x2="795" y2="285" stroke="#8B5CF6" stroke-width="2" opacity="0.6" />
  <line x1="830" y1="350" x2="795" y2="385" stroke="#8B5CF6" stroke-width="2" opacity="0.6" />

  <!-- Cabinet Inner Backboard/Top Cover Panel -->
  <rect x="65" y="10" width="720" height="540" fill="#05040a" />

  <!-- Cabinet Bezel Shadow & Border -->
  <rect x="65" y="60" width="720" height="300" fill="url(#bezel-grad)" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.6" />

  <!-- ==================== MARQUEE SECTION (TOP HEADER) ==================== -->
  <g class="glow-marquee">
    <!-- Marquee Box Frame -->
    <rect x="65" y="10" width="720" height="50" fill="url(#marquee-grad)" stroke="#FF007F" stroke-width="2.5" />
    <line x1="65" y1="60" x2="785" y2="60" stroke="#00D9FF" stroke-width="2" class="pulse-neon" />
    
    <!-- Neon grid background lines on marquee -->
    <line x1="165" y1="10" x2="165" y2="60" stroke="#FF007F" stroke-width="0.5" opacity="0.2" />
    <line x1="265" y1="10" x2="265" y2="60" stroke="#FF007F" stroke-width="0.5" opacity="0.2" />
    <line x1="365" y1="10" x2="365" y2="60" stroke="#FF007F" stroke-width="0.5" opacity="0.2" />
    <line x1="465" y1="10" x2="465" y2="60" stroke="#FF007F" stroke-width="0.5" opacity="0.2" />
    <line x1="565" y1="10" x2="565" y2="60" stroke="#FF007F" stroke-width="0.5" opacity="0.2" />
    <line x1="665" y1="10" x2="665" y2="60" stroke="#FF007F" stroke-width="0.5" opacity="0.2" />

    <!-- Speaker Grills (Top Left & Right of Marquee) -->
    <rect x="75" y="18" width="50" height="15" fill="#000" stroke="#333" stroke-width="0.5" />
    <line x1="80" y1="22" x2="120" y2="22" stroke="#444" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="80" y1="26" x2="120" y2="26" stroke="#444" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="80" y1="30" x2="120" y2="30" stroke="#444" stroke-width="1.5" stroke-dasharray="3 3" />

    <rect x="725" y="18" width="50" height="15" fill="#000" stroke="#333" stroke-width="0.5" />
    <line x1="730" y1="22" x2="770" y2="22" stroke="#444" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="730" y1="26" x2="770" y2="26" stroke="#444" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="730" y1="30" x2="770" y2="30" stroke="#444" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Glowing Marquee Title Text -->
    <text x="425" y="42" class="retro-font neon-text-pink" font-size="16" text-anchor="middle" letter-spacing="4">KATHIRVEL'S ARCADE</text>
  </g>

  <!-- ==================== CRT MONITOR SCREEN AREA ==================== -->
  
  <!-- Screen Frame Border Bezel -->
  <rect x="70" y="66" width="710" height="288" rx="18" fill="none" stroke="#00D9FF" stroke-width="3" filter="url(#glow-c)" opacity="0.8" />
  
  <!-- Screen CRT Bezel Inner Glow -->
  <rect x="74" y="69" width="702" height="282" rx="16" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6" />

  <!-- The Actual Game GIF Embedded inside Screen Clip -->
  <g clip-path="url(#screen-clip)">
    <!-- Main screen background to cover behind gif if slightly misaligned -->
    <rect x="75" y="70" width="700" height="280" fill="#000000" />
    <!-- Embedded Space Shooter GIF -->
    <image href="space-shooter.gif" x="75" y="70" width="700" height="280" />
    <!-- Scanning Overlay Pattern (makes it look like a physical CRT screen!) -->
    <rect x="75" y="70" width="700" height="280" fill="url(#crt-scanlines)" pointer-events="none" />
  </g>

  <!-- Arcade Screen HUD Text HUD Details (Overlayed on Screen Screen) -->
  <g opacity="0.8">
    <!-- P1 and High Score -->
    <text x="95" y="93" class="retro-font" font-size="8" fill="#FF007F">1P</text>
    <text x="95" y="108" class="retro-font" font-size="8">083750</text>

    <text x="425" y="93" class="retro-font" font-size="8" fill="#00FF88" text-anchor="middle">HIGH SCORE</text>
    <text x="425" y="108" class="retro-font" font-size="8" text-anchor="middle">999999</text>

    <text x="755" y="93" class="retro-font" font-size="8" fill="#00D9FF" text-anchor="end">CREDIT</text>
    <text x="755" y="108" class="retro-font" font-size="8" text-anchor="end">99</text>

    <!-- Insert Coin / Click to Play flashing message -->
    <g class="blink">
      <rect x="275" y="318" width="300" height="20" fill="#000000" fill-opacity="0.85" rx="3" stroke="#8B5CF6" stroke-width="0.5" />
      <text x="425" y="332" class="retro-font" font-size="7" fill="#00FF88" text-anchor="middle">⚡ INSERT COIN // PRESS START ⚡</text>
    </g>

    <!-- Technical alignment notches on bezel corner -->
    <circle cx="85" cy="80" r="1.5" fill="#FF007F" />
    <circle cx="765" cy="80" r="1.5" fill="#FF007F" />
    <circle cx="85" cy="340" r="1.5" fill="#FF007F" />
    <circle cx="765" cy="340" r="1.5" fill="#FF007F" />
  </g>

  <!-- ==================== CONTROL DECK (BOTTOM SHELF) ==================== -->
  
  <!-- Control Deck Main Board -->
  <polygon points="65,360 785,360 805,430 45,430" fill="#131024" stroke="#8B5CF6" stroke-width="2" />
  <line x1="65" y1="360" x2="785" y2="360" stroke="#FF007F" stroke-width="1.5" />

  <!-- Deck Grid Accents -->
  <polygon points="80,370 770,370 782,420 68,420" fill="none" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="10 5" />
  <line x1="250" y1="360" x2="230" y2="430" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3" />
  <line x1="600" y1="360" x2="620" y2="430" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3" />

  <!-- Joystick 1 (Left Player) -->
  <g transform="translate(160, 395)">
    <!-- Joystick Base/Ring -->
    <ellipse cx="0" cy="15" rx="20" ry="7" fill="#090710" stroke="#00D9FF" stroke-width="1.5" />
    <!-- Joystick Metal Shaft -->
    <line x1="0" y1="15" x2="-10" y2="-20" stroke="#cccccc" stroke-width="4.5" stroke-linecap="round" />
    <!-- Joystick Ball Top (Cyan Glow) -->
    <circle cx="-10" cy="-20" r="14" fill="#00D9FF" filter="url(#glow-c)" />
    <!-- Highlight on joystick ball -->
    <circle cx="-13" cy="-23" r="4" fill="#ffffff" opacity="0.6" />
    <text x="0" y="32" class="retro-font" font-size="6" text-anchor="middle" fill="#00D9FF">MOVE</text>
  </g>

  <!-- Action Buttons P1 (Left Player) -->
  <g transform="translate(260, 395)">
    <!-- Button A (Green) -->
    <ellipse cx="-15" cy="5" rx="8" ry="5" fill="#059669" stroke="#00FF88" stroke-width="1.5" />
    <text x="-15" y="-5" class="retro-font" font-size="6" text-anchor="middle">A</text>
    <!-- Button B (Pink) -->
    <ellipse cx="10" cy="12" rx="8" ry="5" fill="#9d004c" stroke="#FF007F" stroke-width="1.5" />
    <text x="10" y="2" class="retro-font" font-size="6" text-anchor="middle">B</text>
    <!-- Button C (Blue) -->
    <ellipse cx="35" cy="5" rx="8" ry="5" fill="#0c4a6e" stroke="#00D9FF" stroke-width="1.5" />
    <text x="35" y="-5" class="retro-font" font-size="6" text-anchor="middle">C</text>
  </g>

  <!-- Joystick 2 (Right Player) -->
  <g transform="translate(680, 395)">
    <!-- Joystick Base/Ring -->
    <ellipse cx="0" cy="15" rx="20" ry="7" fill="#090710" stroke="#FF007F" stroke-width="1.5" />
    <!-- Joystick Metal Shaft -->
    <line x1="0" y1="15" x2="8" y2="-20" stroke="#cccccc" stroke-width="4.5" stroke-linecap="round" />
    <!-- Joystick Ball Top (Pink Glow) -->
    <circle cx="8" cy="-20" r="14" fill="#FF007F" filter="url(#glow-p)" />
    <!-- Highlight on joystick ball -->
    <circle cx="5" cy="-23" r="4" fill="#ffffff" opacity="0.6" />
    <text x="0" y="32" class="retro-font" font-size="6" text-anchor="middle" fill="#FF007F">FIRE</text>
  </g>

  <!-- Action Buttons P2 (Right Player) -->
  <g transform="translate(540, 395)">
    <!-- Button X (Pink) -->
    <ellipse cx="-35" cy="5" rx="8" ry="5" fill="#9d004c" stroke="#FF007F" stroke-width="1.5" />
    <text x="-35" y="-5" class="retro-font" font-size="6" text-anchor="middle">X</text>
    <!-- Button Y (Yellow) -->
    <ellipse cx="-10" cy="12" rx="8" ry="5" fill="#b45309" stroke="#FBBF24" stroke-width="1.5" />
    <text x="-10" y="2" class="retro-font" font-size="6" text-anchor="middle">Y</text>
    <!-- Button Z (Cyan) -->
    <ellipse cx="15" cy="5" rx="8" ry="5" fill="#0c4a6e" stroke="#00D9FF" stroke-width="1.5" />
    <text x="15" y="-5" class="retro-font" font-size="6" text-anchor="middle">Z</text>
  </g>

  <!-- 1-Player and 2-Player Start Buttons start -->
  <g transform="translate(425, 385)">
    <!-- 1P Start -->
    <ellipse cx="-30" cy="0" rx="6" ry="4" fill="#fff" opacity="0.8" />
    <!-- Small 1P symbol -->
    <circle cx="-35" cy="8" r="1" fill="#fff" />
    <text x="-30" y="-8" class="retro-font" font-size="5" text-anchor="middle">1P</text>
    
    <!-- 2P Start -->
    <ellipse cx="30" cy="0" rx="6" ry="4" fill="#fff" opacity="0.8" />
    <text x="30" y="-8" class="retro-font" font-size="5" text-anchor="middle">2P</text>
  </g>

  <!-- ==================== CABINET LOWER CABINET/COIN DOOR ==================== -->
  
  <!-- Lower Cabinet Face -->
  <rect x="45" y="430" width="760" height="120" fill="#0d0a1c" stroke="#8B5CF6" stroke-width="2" />
  
  <!-- Cyber-design accent lines on lower cabinet -->
  <line x1="45" y1="460" x2="805" y2="460" stroke="#00D9FF" stroke-width="1" opacity="0.3" />
  <line x1="45" y1="520" x2="805" y2="520" stroke="#00D9FF" stroke-width="1" opacity="0.3" />

  <!-- Coin Door Panel Box -->
  <g transform="translate(325, 440)">
    <rect x="0" y="0" width="200" height="100" rx="5" fill="#05040a" stroke="#444" stroke-width="2" />
    <line x1="100" y1="0" x2="100" y2="100" stroke="#444" stroke-width="1.5" />

    <!-- Coin Slot Left -->
    <g transform="translate(15, 10)">
      <rect x="0" y="0" width="60" height="60" rx="3" fill="#111" stroke="#222" stroke-width="1" />
      <!-- Insert Slot -->
      <rect x="25" y="10" width="10" height="25" fill="#000" stroke="#FF007F" stroke-width="0.8" />
      <line x1="30" y1="13" x2="30" y2="32" stroke="#FF007F" stroke-width="2" filter="url(#glow-p)" />
      <!-- Insert text -->
      <rect x="8" y="42" width="44" height="12" fill="#222" />
      <text x="30" y="51" class="retro-font" font-size="5" fill="#FF007F" text-anchor="middle" filter="url(#glow-p)">25¢</text>
    </g>

    <!-- Coin Slot Right -->
    <g transform="translate(125, 10)">
      <rect x="0" y="0" width="60" height="60" rx="3" fill="#111" stroke="#222" stroke-width="1" />
      <!-- Insert Slot -->
      <rect x="25" y="10" width="10" height="25" fill="#000" stroke="#FF007F" stroke-width="0.8" />
      <line x1="30" y1="13" x2="30" y2="32" stroke="#FF007F" stroke-width="2" filter="url(#glow-p)" />
      <!-- Insert text -->
      <rect x="8" y="42" width="44" height="12" fill="#222" />
      <text x="30" y="51" class="retro-font" font-size="5" fill="#FF007F" text-anchor="middle" filter="url(#glow-p)">25¢</text>
    </g>

    <!-- Coin Returns -->
    <rect x="25" y="78" width="40" height="15" fill="#1a1a1a" stroke="#333" stroke-width="1" />
    <rect x="135" y="78" width="40" height="15" fill="#1a1a1a" stroke="#333" stroke-width="1" />
  </g>

  <!-- Left/Right Ventilation/Hatch details on lower cab -->
  <g opacity="0.3">
    <line x1="100" y1="465" x2="200" y2="465" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="100" y1="475" x2="200" y2="475" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="100" y1="485" x2="200" y2="485" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 8" />

    <line x1="650" y1="465" x2="750" y2="465" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="650" y1="475" x2="750" y2="475" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="650" y1="485" x2="750" y2="485" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 8" />
  </g>
  
</svg>
