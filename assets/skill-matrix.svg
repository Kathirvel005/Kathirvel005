<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="100%" height="100%">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#090e1c" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0)" />
    </linearGradient>

    <filter id="glowMatrix" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="matrixDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="rgba(0, 240, 255, 0.15)" />
    </pattern>
  </defs>

  <style>
    @keyframes cardShine {
      0%, 100% { border-color: rgba(0, 240, 255, 0.2); }
      50% { border-color: rgba(139, 92, 246, 0.4); }
    }
    .skill-card { transition: all 0.3s ease; }
  </style>

  <!-- Canvas -->
  <rect width="1000" height="490" rx="14" fill="url(#matrixBg)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" />
  <rect width="1000" height="490" rx="14" fill="url(#matrixDots)" />

  <!-- Corner Brackets -->
  <path d="M 2 20 L 2 2 L 20 2" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 980 2 L 998 2 L 998 20" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 2 470 L 2 488 L 20 488" fill="none" stroke="#8b5cf6" stroke-width="3" />
  <path d="M 980 488 L 998 488 L 998 470" fill="none" stroke="#8b5cf6" stroke-width="3" />

  <!-- Top Title Bar -->
  <g transform="translate(30, 25)">
    <rect width="320" height="24" rx="4" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" />
    <text x="15" y="16" fill="#00f0ff" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1.5">
      // TECHNOLOGY MATRIX :: FULL-STACK &amp; AI
    </text>
    <text x="940" y="16" text-anchor="end" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="10">
      SYSTEM ARCHITECTURE // PRODUCTION READY
    </text>
  </g>

  <!-- ROW 1: 3 CATEGORIES (Languages, AI &amp; ML, Backend) -->
  
  <!-- Col 1: LANGUAGES -->
  <g transform="translate(30, 70)">
    <rect width="300" height="185" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2" />
    <!-- Header -->
    <path d="M 0 8 Q 0 0 8 0 L 292 0 Q 300 0 300 8 L 300 32 L 0 32 Z" fill="rgba(0, 240, 255, 0.08)" />
    <circle cx="18" cy="16" r="3.5" fill="#00f0ff" />
    <text x="32" y="20" fill="#00f0ff" font-family="'Courier New', monospace" font-size="12" font-weight="800" letter-spacing="1">LANGUAGES</text>
    <text x="285" y="20" text-anchor="end" fill="rgba(255, 255, 255, 0.3)" font-family="'Courier New', monospace" font-size="9">[01]</text>

    <!-- Skills Inside -->
    <g transform="translate(15, 45)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="125" height="28" rx="4" fill="rgba(55, 118, 171, 0.15)" stroke="#3776ab" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#3776ab" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Python</text>
      </g>
      <!-- Java -->
      <g transform="translate(145, 0)">
        <rect width="125" height="28" rx="4" fill="rgba(231, 111, 0, 0.15)" stroke="#ea580c" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#ea580c" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Java (Core/Adv)</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(0, 42)">
        <rect width="125" height="28" rx="4" fill="rgba(247, 223, 30, 0.15)" stroke="#eab308" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#facc15" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">JavaScript (ES6+)</text>
      </g>
      <!-- SQL -->
      <g transform="translate(145, 42)">
        <rect width="125" height="28" rx="4" fill="rgba(0, 117, 143, 0.15)" stroke="#0284c7" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#38bdf8" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">SQL / RDBMS</text>
      </g>
      <!-- Meta note -->
      <text x="5" y="118" fill="rgba(255, 255, 255, 0.45)" font-family="'Courier New', monospace" font-size="10">
        Engine: Algorithmic &amp; OOP Foundations
      </text>
    </g>
  </g>

  <!-- Col 2: AI &amp; MACHINE LEARNING -->
  <g transform="translate(350, 70)">
    <rect width="300" height="185" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 292 0 Q 300 0 300 8 L 300 32 L 0 32 Z" fill="rgba(139, 92, 246, 0.12)" />
    <circle cx="18" cy="16" r="3.5" fill="#a855f7" />
    <text x="32" y="20" fill="#c084fc" font-family="'Courier New', monospace" font-size="12" font-weight="800" letter-spacing="1">AI / MACHINE LEARNING</text>
    <text x="285" y="20" text-anchor="end" fill="rgba(255, 255, 255, 0.3)" font-family="'Courier New', monospace" font-size="9">[02]</text>

    <g transform="translate(15, 45)">
      <!-- Machine Learning -->
      <g transform="translate(0, 0)">
        <rect width="125" height="28" rx="4" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#a855f7" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Scikit-Learn / ML</text>
      </g>
      <!-- TensorFlow -->
      <g transform="translate(145, 0)">
        <rect width="125" height="28" rx="4" fill="rgba(255, 111, 0, 0.15)" stroke="#f97316" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#fb923c" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">TensorFlow</text>
      </g>
      <!-- OpenCV -->
      <g transform="translate(0, 42)">
        <rect width="125" height="28" rx="4" fill="rgba(0, 240, 255, 0.15)" stroke="#06b6d4" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#22d3ee" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">OpenCV Vision</text>
      </g>
      <!-- MediaPipe -->
      <g transform="translate(145, 42)">
        <rect width="125" height="28" rx="4" fill="rgba(0, 255, 136, 0.15)" stroke="#10b981" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#34d399" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">MediaPipe (HCI)</text>
      </g>
      <text x="5" y="118" fill="rgba(255, 255, 255, 0.45)" font-family="'Courier New', monospace" font-size="10">
        Inference: Biometrics, HCI &amp; Predictive Anomaly
      </text>
    </g>
  </g>

  <!-- Col 3: BACKEND ARCHITECTURE -->
  <g transform="translate(670, 70)">
    <rect width="300" height="185" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="rgba(0, 255, 136, 0.25)" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 292 0 Q 300 0 300 8 L 300 32 L 0 32 Z" fill="rgba(0, 255, 136, 0.08)" />
    <circle cx="18" cy="16" r="3.5" fill="#00ff88" />
    <text x="32" y="20" fill="#00ff88" font-family="'Courier New', monospace" font-size="12" font-weight="800" letter-spacing="1">BACKEND</text>
    <text x="285" y="20" text-anchor="end" fill="rgba(255, 255, 255, 0.3)" font-family="'Courier New', monospace" font-size="9">[03]</text>

    <g transform="translate(15, 45)">
      <!-- Spring Boot -->
      <g transform="translate(0, 0)">
        <rect width="125" height="28" rx="4" fill="rgba(109, 179, 63, 0.15)" stroke="#65a30d" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#84cc16" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Spring Boot</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(145, 0)">
        <rect width="125" height="28" rx="4" fill="rgba(51, 153, 51, 0.15)" stroke="#16a34a" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#22c55e" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Node.js</text>
      </g>
      <!-- Express.js -->
      <g transform="translate(0, 42)">
        <rect width="125" height="28" rx="4" fill="rgba(255, 255, 255, 0.08)" stroke="#64748b" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#94a3b8" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Express.js</text>
      </g>
      <!-- REST APIs -->
      <g transform="translate(145, 42)">
        <rect width="125" height="28" rx="4" fill="rgba(0, 240, 255, 0.12)" stroke="#0284c7" stroke-width="1" />
        <circle cx="14" cy="14" r="4" fill="#00f0ff" />
        <text x="26" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">REST APIs / JWT</text>
      </g>
      <text x="5" y="118" fill="rgba(255, 255, 255, 0.45)" font-family="'Courier New', monospace" font-size="10">
        Enterprise Microservices &amp; Auth Handlers
      </text>
    </g>
  </g>

  <!-- ROW 2: 4 CATEGORIES (Frontend, Database, Tools, Deployment) -->

  <!-- Col 1: FRONTEND -->
  <g transform="translate(30, 275)">
    <rect width="220" height="185" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 212 0 Q 220 0 220 8 L 220 30 L 0 30 Z" fill="rgba(0, 240, 255, 0.06)" />
    <text x="15" y="19" fill="#00f0ff" font-family="'Courier New', monospace" font-size="11" font-weight="800">FRONTEND</text>

    <g transform="translate(12, 42)">
      <rect x="0" y="0" width="90" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)" stroke="#e44d26" stroke-width="0.8" />
      <text x="10" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">HTML5</text>

      <rect x="100" y="0" width="90" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)" stroke="#264de4" stroke-width="0.8" />
      <text x="110" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">CSS3</text>

      <rect x="0" y="34" width="90" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)" stroke="#f7df1e" stroke-width="0.8" />
      <text x="10" y="50" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">JavaScript</text>

      <rect x="100" y="34" width="90" height="24" rx="4" fill="rgba(97, 218, 251, 0.1)" stroke="#61dafb" stroke-width="0.8" />
      <text x="110" y="50" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">React.js</text>

      <text x="2" y="96" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="9">
        Reactive Web Apps
      </text>
      <text x="2" y="112" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="9">
        TailwindCSS &amp; State
      </text>
    </g>
  </g>

  <!-- Col 2: DATABASE -->
  <g transform="translate(270, 275)">
    <rect width="220" height="185" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 212 0 Q 220 0 220 8 L 220 30 L 0 30 Z" fill="rgba(139, 92, 246, 0.08)" />
    <text x="15" y="19" fill="#c084fc" font-family="'Courier New', monospace" font-size="11" font-weight="800">DATABASES</text>

    <g transform="translate(12, 42)">
      <rect x="0" y="0" width="190" height="24" rx="4" fill="rgba(0, 117, 143, 0.12)" stroke="#00758f" stroke-width="0.8" />
      <text x="12" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">MySQL (Relational / ACID)</text>

      <rect x="0" y="34" width="190" height="24" rx="4" fill="rgba(71, 162, 72, 0.12)" stroke="#47a248" stroke-width="0.8" />
      <text x="12" y="50" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">MongoDB (NoSQL Document)</text>

      <rect x="0" y="68" width="190" height="24" rx="4" fill="rgba(14, 165, 233, 0.12)" stroke="#0284c7" stroke-width="0.8" />
      <text x="12" y="84" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">SQLite (Embedded / Local)</text>

      <text x="2" y="118" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="9">
        Schema Design &amp; Indexing
      </text>
    </g>
  </g>

  <!-- Col 3: TOOLS &amp; DEVOPS -->
  <g transform="translate(510, 275)">
    <rect width="220" height="185" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="rgba(0, 255, 136, 0.2)" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 212 0 Q 220 0 220 8 L 220 30 L 0 30 Z" fill="rgba(0, 255, 136, 0.06)" />
    <text x="15" y="19" fill="#00ff88" font-family="'Courier New', monospace" font-size="11" font-weight="800">TOOLS &amp; DEVOPS</text>

    <g transform="translate(12, 42)">
      <rect x="0" y="0" width="90" height="24" rx="4" fill="rgba(240, 80, 50, 0.1)" stroke="#f05032" stroke-width="0.8" />
      <text x="10" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">Git / VCS</text>

      <rect x="100" y="0" width="90" height="24" rx="4" fill="rgba(255, 255, 255, 0.08)" stroke="#64748b" stroke-width="0.8" />
      <text x="110" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">GitHub</text>

      <rect x="0" y="34" width="90" height="24" rx="4" fill="rgba(36, 150, 237, 0.1)" stroke="#2496ed" stroke-width="0.8" />
      <text x="10" y="50" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">Docker</text>

      <rect x="100" y="34" width="90" height="24" rx="4" fill="rgba(255, 108, 55, 0.1)" stroke="#ff6c37" stroke-width="0.8" />
      <text x="110" y="50" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">Postman</text>

      <rect x="0" y="68" width="190" height="24" rx="4" fill="rgba(0, 122, 204, 0.1)" stroke="#007acc" stroke-width="0.8" />
      <text x="12" y="84" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">VS Code IDE Environment</text>

      <text x="2" y="118" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="9">
        Containerization &amp; CI/CD
      </text>
    </g>
  </g>

  <!-- Col 4: DEPLOYMENT -->
  <g transform="translate(750, 275)">
    <rect width="220" height="185" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 212 0 Q 220 0 220 8 L 220 30 L 0 30 Z" fill="rgba(255, 255, 255, 0.06)" />
    <text x="15" y="19" fill="#f1f5f9" font-family="'Courier New', monospace" font-size="11" font-weight="800">DEPLOYMENT</text>

    <g transform="translate(12, 42)">
      <rect x="0" y="0" width="190" height="24" rx="4" fill="rgba(255, 255, 255, 0.08)" stroke="#ffffff" stroke-width="0.8" />
      <text x="12" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">▲ Vercel (Edge Web Hosting)</text>

      <rect x="0" y="34" width="190" height="24" rx="4" fill="rgba(70, 227, 183, 0.1)" stroke="#46e3b7" stroke-width="0.8" />
      <text x="12" y="50" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">● Render (Cloud Web Services)</text>

      <rect x="0" y="68" width="190" height="24" rx="4" fill="rgba(255, 153, 0, 0.1)" stroke="#ff9900" stroke-width="0.8" />
      <text x="12" y="84" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">■ AWS (Cloud Fundamentals)</text>

      <text x="2" y="118" fill="rgba(255, 255, 255, 0.4)" font-family="'Courier New', monospace" font-size="9">
        Continuous Live Deployments
      </text>
    </g>
  </g>
</svg>
