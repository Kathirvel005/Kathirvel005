<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="100%" height="100%">
  <defs>
    <linearGradient id="coreBarBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04060c" />
      <stop offset="50%" stop-color="#0d1428" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <linearGradient id="dividerCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.1)" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="rgba(0, 255, 136, 0.1)" />
    </linearGradient>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseHeartbeat {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }
    .heartbeat { transform-origin: 500px 35px; animation: pulseHeartbeat 2s infinite ease-in-out; }
  </style>

  <!-- Background Bar -->
  <rect width="1000" height="70" rx="8" fill="url(#coreBarBg)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
  
  <!-- Glowing Horizontal Rule -->
  <line x1="20" y1="35" x2="440" y2="35" stroke="url(#dividerCyanPurple)" stroke-width="2" />
  <line x1="560" y1="35" x2="980" y2="35" stroke="url(#dividerCyanPurple)" stroke-width="2" />

  <!-- Center Core Capsule -->
  <g class="heartbeat">
    <rect x="445" y="16" width="110" height="38" rx="19" fill="#080e1c" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="468" cy="35" r="4.5" fill="#00ff88" filter="url(#coreGlow)" />
    <text x="480" y="39" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="800" letter-spacing="1">
      ACTIVE
    </text>
  </g>

  <!-- Left Telemetry Marker -->
  <text x="35" y="40" fill="rgba(255, 255, 255, 0.45)" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
    SYS_ID: KATHIRVEL-005 // AI NEURAL SUBSYSTEM
  </text>

  <!-- Right Telemetry Marker -->
  <text x="965" y="40" text-anchor="end" fill="rgba(255, 255, 255, 0.45)" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
    STATUS: ONLINE // 99.98% UPTIME
  </text>
</svg>
