<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%">
  <defs>
    <linearGradient id="missionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0d142b" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <linearGradient id="missionBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <filter id="glowMission" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseTarget {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    .reticle-core { transform-origin: 900px 90px; animation: pulseTarget 3s infinite ease-in-out; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="180" rx="12" fill="url(#missionBg)" stroke="url(#missionBorder)" stroke-width="1.8" />

  <!-- Corner Brackets -->
  <path d="M 2 20 L 2 2 L 20 2" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 980 2 L 998 2 L 998 20" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 2 160 L 2 178 L 20 178" fill="none" stroke="#00ff88" stroke-width="3" />
  <path d="M 980 178 L 998 178 L 998 160" fill="none" stroke="#00ff88" stroke-width="3" />

  <!-- Left Content Area -->
  <g transform="translate(45, 30)">
    <!-- Header Badge -->
    <rect width="210" height="22" rx="4" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
    <text x="12" y="15" fill="#00f0ff" font-family="'Courier New', monospace" font-size="11" font-weight="800" letter-spacing="2">
      // CURRENT MISSION
    </text>

    <!-- Main Mission Statement -->
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">
      Build intelligent, practical, and scalable AI systems.
    </text>

    <!-- Focus Areas Tags -->
    <g transform="translate(0, 72)">
      <text x="0" y="16" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" font-weight="700">FOCUS AREAS:</text>
      
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="40" height="22" rx="4" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="0.8" />
        <text x="20" y="15" text-anchor="middle" fill="#00f0ff" font-family="'Courier New', monospace" font-size="10" font-weight="700">AI</text>

        <rect x="48" y="0" width="135" height="22" rx="4" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="0.8" />
        <text x="115" y="15" text-anchor="middle" fill="#c084fc" font-family="'Courier New', monospace" font-size="10" font-weight="700">Machine Learning</text>

        <rect x="191" y="0" width="125" height="22" rx="4" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="0.8" />
        <text x="253" y="15" text-anchor="middle" fill="#22d3ee" font-family="'Courier New', monospace" font-size="10" font-weight="700">Computer Vision</text>

        <rect x="324" y="0" width="170" height="22" rx="4" fill="rgba(0, 255, 136, 0.12)" stroke="#00ff88" stroke-width="0.8" />
        <text x="409" y="15" text-anchor="middle" fill="#00ff88" font-family="'Courier New', monospace" font-size="10" font-weight="700">Full Stack Development</text>

        <rect x="502" y="0" width="80" height="22" rx="4" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="0.8" />
        <text x="542" y="15" text-anchor="middle" fill="#f59e0b" font-family="'Courier New', monospace" font-size="10" font-weight="700">Robotics</text>
      </g>
    </g>

    <!-- Subtext -->
    <text x="0" y="125" fill="rgba(255, 255, 255, 0.45)" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
      TARGET: REAL-WORLD PROBLEM SOLVING VIA LOW-LATENCY NEURAL SYSTEMS &amp; INDUSTRIAL AUTOMATION
    </text>
  </g>

  <!-- Right Holographic Targeting Reticle -->
  <g class="reticle-core">
    <circle cx="900" cy="90" r="50" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="900" cy="90" r="32" fill="none" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.8" />
    <circle cx="900" cy="90" r="14" fill="rgba(0, 255, 136, 0.2)" stroke="#00ff88" stroke-width="2" />
    <circle cx="900" cy="90" r="4" fill="#ffffff" filter="url(#glowMission)" />
    <!-- Crosshairs -->
    <line x1="840" y1="90" x2="960" y2="90" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
    <line x1="900" y1="30" x2="900" y2="150" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
  </g>
</svg>
