<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="100%" stop-color="#090e1f" />
    </linearGradient>

    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.35)" />
      <stop offset="100%" stop-color="rgba(0, 255, 136, 0.3)" />
    </linearGradient>

    <filter id="glowRadar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes polyPulse {
      0%, 100% { fill-opacity: 0.35; stroke-width: 2; }
      50% { fill-opacity: 0.55; stroke-width: 2.8; }
    }

    .sweep-line { transform-origin: 400px 245px; animation: radarSweep 10s linear infinite; }
    .radar-polygon { animation: polyPulse 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" rx="14" fill="url(#radarBg)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <path d="M 2 20 L 2 2 L 20 2" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 780 2 L 798 2 L 798 20" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 2 480 L 2 498 L 20 498" fill="none" stroke="#8b5cf6" stroke-width="3" />
  <path d="M 780 498 L 798 498 L 798 480" fill="none" stroke="#8b5cf6" stroke-width="3" />

  <!-- Top Title Bar -->
  <g transform="translate(30, 25)">
    <text x="0" y="16" fill="#00f0ff" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2">
      // AI CAPABILITY RADAR :: MULTI-DIMENSIONAL FOCUS
    </text>
    <rect x="0" y="24" width="260" height="20" rx="4" fill="rgba(139, 92, 246, 0.1)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
    <text x="8" y="38" fill="#c084fc" font-family="'Courier New', monospace" font-size="10" font-weight="600">
      * Self-assessed focus areas
    </text>
  </g>

  <!-- Concentric Rings (R = 35, 70, 105, 140 from cx=400, cy=245) -->
  <g>
    <!-- R = 140 -->
    <polygon points="400,105 489.9,137.7 537.9,219.1 507.2,307.9 424.3,371.8 335.7,371.8 252.8,307.9 222.1,219.1 270.1,137.7" 
             fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" />
    <!-- R = 105 -->
    <polygon points="400,140 467.4,164.5 503.4,225.6 480.4,292.2 418.2,340.1 351.8,340.1 289.6,292.2 266.6,225.6 302.6,164.5" 
             fill="none" stroke="rgba(0, 240, 255, 0.18)" stroke-width="1" stroke-dasharray="3 3" />
    <!-- R = 70 -->
    <polygon points="400,175 444.9,191.3 468.9,232 453.6,276.4 412.1,308.4 367.9,308.4 326.4,276.4 311.1,232 335.1,191.3" 
             fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1" />
    <!-- R = 35 -->
    <polygon points="400,210 422.5,218.2 434.5,238.5 426.8,260.7 406.1,276.7 383.9,276.7 363.2,260.7 355.5,238.5 367.5,218.2" 
             fill="none" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1" />

    <!-- 9 Radial Axis Spoke Lines -->
    <line x1="400" y1="245" x2="400" y2="105" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
    <line x1="400" y1="245" x2="489.9" y2="137.7" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
    <line x1="400" y1="245" x2="537.9" y2="219.1" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
    <line x1="400" y1="245" x2="507.2" y2="307.9" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
    <line x1="400" y1="245" x2="424.3" y2="371.8" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
    <line x1="400" y1="245" x2="335.7" y2="371.8" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
    <line x1="400" y1="245" x2="252.8" y2="307.9" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
    <line x1="400" y1="245" x2="222.1" y2="219.1" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
    <line x1="400" y1="245" x2="270.1" y2="137.7" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
  </g>

  <!-- Sweeping Radar Scanner Line -->
  <line class="sweep-line" x1="400" y1="245" x2="400" y2="105" stroke="#00f0ff" stroke-width="2" opacity="0.6" filter="url(#glowRadar)" />

  <!-- Data Polygon (Kathirvel's Self-Assessed Distribution) -->
  <!--
    Axes &amp; Scaled Values (out of 140 max):
    1. Python (95% -> 133): 400, 112
    2. Java (82% -> 114.8): 473.7, 157.0
    3. Backend (85% -> 119): 517.2, 223.0
    4. Database (84% -> 117.6): 490.1, 297.8
    5. Git/GitHub (90% -> 126): 421.9, 359.1
    6. Frontend (86% -> 120.4): 344.5, 354.3
    7. Robotics (82% -> 114.8): 279.3, 296.6
    8. Computer Vision (92% -> 128.8): 236.3, 221.2
    9. AI / ML (92% -> 128.8): 280.5, 146.3
  -->
  <polygon class="radar-polygon" 
           points="400,112 473.7,157 517.2,223 490.1,297.8 421.9,359.1 344.5,354.3 279.3,296.6 236.3,221.2 280.5,146.3" 
           fill="url(#polyGrad)" stroke="#00f0ff" stroke-width="2" filter="url(#glowRadar)" />

  <!-- Data Points -->
  <circle cx="400" cy="112" r="4" fill="#ffffff" stroke="#00f0ff" stroke-width="2" />
  <circle cx="473.7" cy="157" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
  <circle cx="517.2" cy="223" r="4" fill="#ffffff" stroke="#00ff88" stroke-width="2" />
  <circle cx="490.1" cy="297.8" r="4" fill="#ffffff" stroke="#00f0ff" stroke-width="2" />
  <circle cx="421.9" cy="359.1" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
  <circle cx="344.5" cy="354.3" r="4" fill="#ffffff" stroke="#00ff88" stroke-width="2" />
  <circle cx="279.3" cy="296.6" r="4" fill="#ffffff" stroke="#00f0ff" stroke-width="2" />
  <circle cx="236.3" cy="221.2" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
  <circle cx="280.5" cy="146.3" r="4" fill="#ffffff" stroke="#00ff88" stroke-width="2" />

  <!-- Labels on Perimeter -->
  <!-- 1: Python -->
  <g transform="translate(400, 85)">
    <rect x="-42" y="-14" width="84" height="20" rx="4" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1" />
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="700">PYTHON</text>
  </g>

  <!-- 2: Java -->
  <g transform="translate(525, 130)">
    <rect x="-32" y="-12" width="64" height="20" rx="4" fill="rgba(234, 88, 12, 0.15)" stroke="#ea580c" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="700">JAVA</text>
  </g>

  <!-- 3: Backend -->
  <g transform="translate(595, 220)">
    <rect x="-40" y="-12" width="80" height="20" rx="4" fill="rgba(0, 255, 136, 0.15)" stroke="#00ff88" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" font-weight="700">BACKEND</text>
  </g>

  <!-- 4: Database -->
  <g transform="translate(565, 325)">
    <rect x="-44" y="-12" width="88" height="20" rx="4" fill="rgba(14, 165, 233, 0.15)" stroke="#0284c7" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" font-weight="700">DATABASE</text>
  </g>

  <!-- 5: Git / GitHub -->
  <g transform="translate(440, 395)">
    <rect x="-48" y="-12" width="96" height="20" rx="4" fill="rgba(240, 80, 50, 0.15)" stroke="#f05032" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" font-weight="700">GIT / GITHUB</text>
  </g>

  <!-- 6: Frontend -->
  <g transform="translate(315, 395)">
    <rect x="-44" y="-12" width="88" height="20" rx="4" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" font-weight="700">FRONTEND</text>
  </g>

  <!-- 7: Robotics -->
  <g transform="translate(195, 325)">
    <rect x="-44" y="-12" width="88" height="20" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" font-weight="700">ROBOTICS</text>
  </g>

  <!-- 8: Computer Vision -->
  <g transform="translate(145, 220)">
    <rect x="-56" y="-12" width="112" height="20" rx="4" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="9" font-weight="700">COMPUTER VISION</text>
  </g>

  <!-- 9: AI / ML -->
  <g transform="translate(225, 130)">
    <rect x="-40" y="-12" width="80" height="20" rx="4" fill="rgba(0, 255, 136, 0.15)" stroke="#00ff88" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" font-weight="700">AI / ML</text>
  </g>

  <!-- Center Origin Core -->
  <circle cx="400" cy="245" r="4" fill="#00f0ff" filter="url(#glowRadar)" />

  <!-- Bottom Legend / Verification Tag -->
  <text x="400" y="468" text-anchor="middle" fill="rgba(255, 255, 255, 0.45)" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
    SCALE: 0 TO 100% RELATIVE DOMAIN DEVOTION // NON-FABRICATED PROFILE METRICS
  </text>
</svg>
