<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <!-- Background and Glow Gradients -->
    <linearGradient id="db-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07070d" />
      <stop offset="100%" stop-color="#020204" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#0088cc" />
    </linearGradient>
    <linearGradient id="neon-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#009955" />
    </linearGradient>
    <linearGradient id="neon-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#99004c" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
    
    .tech-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .text-green { fill: #00FF88; }
    .text-cyan { fill: #00D9FF; }
    .text-pink { fill: #FF007F; }
    .text-dim { fill: #555566; }

    /* CSS Keyframe Animations */
    @keyframes bar-pulse-1 {
      0%, 100% { height: 30px; y: 110px; }
      50% { height: 95px; y: 45px; }
    }
    @keyframes bar-pulse-2 {
      0%, 100% { height: 85px; y: 55px; }
      50% { height: 20px; y: 120px; }
    }
    @keyframes bar-pulse-3 {
      0%, 100% { height: 40px; y: 100px; }
      40% { height: 98px; y: 42px; }
      80% { height: 60px; y: 80px; }
    }
    @keyframes bar-pulse-4 {
      0%, 100% { height: 65px; y: 75px; }
      30% { height: 25px; y: 115px; }
      70% { height: 90px; y: 50px; }
    }
    
    @keyframes node-blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0 0 3px #00FF88); }
    }
    @keyframes sweep {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes spin-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes text-scroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-48px); }
    }

    /* Animation class attachments */
    .cpu-1 { animation: bar-pulse-1 1.6s ease-in-out infinite; }
    .cpu-2 { animation: bar-pulse-2 2.1s ease-in-out infinite; }
    .cpu-3 { animation: bar-pulse-3 1.9s ease-in-out infinite; }
    .cpu-4 { animation: bar-pulse-4 2.4s ease-in-out infinite; }
    
    .node-active { animation: node-blink 1.5s infinite alternate; }
    .node-delay-1 { animation: node-blink 1.8s infinite alternate; animation-delay: 0.3s; }
    .node-delay-2 { animation: node-blink 1.4s infinite alternate; animation-delay: 0.7s; }
    
    .gaugering {
      transform-origin: 510px 100px;
      animation: spin-cw 8s linear infinite;
    }
    .sweep-line {
      stroke-dasharray: 20 180;
      animation: sweep 4s linear infinite;
    }
    .scrolling-logs {
      animation: text-scroll 8s steps(4) infinite;
    }
  </style>

  <!-- Frame Background Background Dashboard Dashboard -->
  <rect width="850" height="200" rx="10" fill="url(#db-bg)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Diagnostics grid overlay -->
  <line x1="15" y1="15" x2="835" y2="15" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2" />
  <line x1="15" y1="185" x2="835" y2="185" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2" />
  <line x1="15" y1="15" x2="15" y2="185" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2" />
  <line x1="835" y1="15" x2="835" y2="185" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2" />

  <!-- Partition lines -->
  <line x1="220" y1="20" x2="220" y2="180" stroke="#8B5CF6" stroke-width="1" opacity="0.3" />
  <line x1="430" y1="20" x2="430" y2="180" stroke="#8B5CF6" stroke-width="1" opacity="0.3" />
  <line x1="600" y1="20" x2="600" y2="180" stroke="#8B5CF6" stroke-width="1" opacity="0.3" />

  <!-- ==================== COLUMN 1: CPU LOGIC CORE ANALYZER ==================== -->
  <g transform="translate(25, 10)">
    <text class="tech-text text-green" x="0" y="20">⚡ LOGIC CORES // ACTIVITY</text>
    
    <!-- Core 1 -->
    <text class="tech-text text-dim" x="0" y="45" font-size="9">C01</text>
    <rect class="cpu-1" x="30" y="45" width="10" height="95" rx="1.5" fill="url(#neon-green)" filter="url(#glow-g)" />
    
    <!-- Core 2 -->
    <text class="tech-text text-dim" x="45" y="45" font-size="9">C02</text>
    <rect class="cpu-2" x="75" y="55" width="10" height="85" rx="1.5" fill="url(#neon-green)" filter="url(#glow-g)" />
    
    <!-- Core 3 -->
    <text class="tech-text text-dim" x="90" y="45" font-size="9">C03</text>
    <rect class="cpu-3" x="120" y="100" width="10" height="40" rx="1.5" fill="url(#neon-green)" filter="url(#glow-g)" />
    
    <!-- Core 4 -->
    <text class="tech-text text-dim" x="135" y="45" font-size="9">C04</text>
    <rect class="cpu-4" x="165" y="75" width="10" height="65" rx="1.5" fill="url(#neon-green)" filter="url(#glow-g)" />

    <!-- Baseline line -->
    <line x1="20" y1="142" x2="185" y2="142" stroke="#00FF88" stroke-width="1" opacity="0.5" />
  </g>

  <!-- ==================== COLUMN 2: AI NEURAL CONNECTIONS ==================== -->
  <g transform="translate(240, 10)">
    <text class="tech-text text-cyan" x="0" y="20">🌐 AI NEURAL CONNECTIONS // SYNC</text>
    
    <!-- Neural Node Map Map -->
    <g transform="translate(10, 40)">
      <!-- Connector Lines -->
      <line x1="30" y1="30" x2="80" y2="20" stroke="#00D9FF" stroke-width="1" opacity="0.4" />
      <line x1="30" y1="30" x2="60" y2="70" stroke="#00D9FF" stroke-width="1" opacity="0.4" />
      <line x1="80" y1="20" x2="130" y2="40" stroke="#00D9FF" stroke-width="1" opacity="0.4" />
      <line x1="60" y1="70" x2="110" y2="85" stroke="#00D9FF" stroke-width="1" opacity="0.4" />
      <line x1="130" y1="40" x2="110" y2="85" stroke="#00D9FF" stroke-width="1" opacity="0.4" />
      <line x1="80" y1="20" x2="110" y2="85" stroke="#00D9FF" stroke-width="1" opacity="0.4" />
      <line x1="130" y1="40" x2="160" y2="20" stroke="#00D9FF" stroke-width="1" opacity="0.4" />
      <line x1="110" y1="85" x2="160" y2="75" stroke="#00D9FF" stroke-width="1" opacity="0.4" />

      <!-- Nodes -->
      <circle class="node-active" cx="30" cy="30" r="5" fill="#00D9FF" filter="url(#glow-c)" />
      <text class="tech-text text-dim" x="20" y="18" font-size="8">IN_01</text>
      
      <circle class="node-delay-1" cx="80" cy="20" r="4" fill="#8B5CF6" />
      
      <circle class="node-delay-2" cx="60" cy="70" r="5" fill="#00FF88" />
      
      <circle class="node-active" cx="130" cy="40" r="6" fill="#00D9FF" filter="url(#glow-c)" />
      <text class="tech-text" x="123" y="55" font-size="8" fill="#00D9FF">ML_0</text>
      
      <circle class="node-delay-1" cx="110" cy="85" r="4" fill="#8B5CF6" />
      
      <circle class="node-active" cx="160" cy="20" r="5" fill="#00FF88" />
      <text class="tech-text text-dim" x="155" y="10" font-size="8">OUT</text>
      
      <circle class="node-delay-2" cx="160" cy="75" r="4" fill="#00D9FF" />
    </g>
  </g>

  <!-- ==================== COLUMN 3: SYSTEM MEMORY DIAGNOSTICS ==================== -->
  <g transform="translate(450, 10)">
    <text class="tech-text text-pink" x="0" y="20" text-anchor="middle">💾 DYNAMIC STORAGE</text>
    
    <!-- Gauges -->
    <g transform="translate(0, 90)">
      <!-- Outer dial -->
      <circle cx="0" cy="0" r="45" fill="none" stroke="#221e38" stroke-width="5" />
      
      <!-- Filling gauge -->
      <circle class="gaugering" cx="0" cy="0" r="45" fill="none" stroke="url(#neon-pink)" stroke-width="5" stroke-dasharray="210 280" stroke-linecap="round" />
      
      <!-- Central text readout -->
      <text class="tech-text text-pink" x="0" y="4" font-size="14" font-weight="bold" text-anchor="middle" filter="url(#glow-c)">74.2%</text>
      <text class="tech-text text-dim" x="0" y="18" font-size="8" text-anchor="middle">SYNCED</text>

      <!-- Inner ticks -->
      <circle cx="0" cy="0" r="35" fill="none" stroke="#00D9FF" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.3" />
    </g>
  </g>

  <!-- ==================== COLUMN 4: DIAGNOSTIC LOGS STREAM ==================== -->
  <g transform="translate(615, 10)">
    <text class="tech-text text-cyan" x="0" y="20">⚡ DIAGNOSTIC SHELL LOGS</text>
    
    <!-- Log Display Window -->
    <rect x="-5" y="32" width="215" height="120" rx="3" fill="#040408" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3" />
    
    <!-- Scanning line in window -->
    <line x1="-5" y1="32" x2="210" y2="32" stroke="#00FF88" stroke-width="0.5" opacity="0.2" />

    <!-- Scrolling Log Texts container with mask -->
    <g transform="translate(5, 42)" clip-path="url(#log-mask)">
      <g class="scrolling-logs">
        <text class="tech-text text-green" x="0" y="12" font-size="9">> NEURAL ENGINE ... ONLINE</text>
        <text class="tech-text text-cyan" x="0" y="24" font-size="9">> CV_DETECTOR ... REGISTERED</text>
        <text class="tech-text" x="0" y="36" font-size="9">> COMPILING SPRING FRAMEWORK ... OK</text>
        <text class="tech-text text-pink" x="0" y="48" font-size="9">> SECURITY clearance A ... CLEAR</text>
        
        <text class="tech-text text-green" x="0" y="60" font-size="9">> NEURAL ENGINE ... ONLINE</text>
        <text class="tech-text text-cyan" x="0" y="72" font-size="9">> CV_DETECTOR ... REGISTERED</text>
        <text class="tech-text" x="0" y="84" font-size="9">> COMPILING SPRING FRAMEWORK ... OK</text>
        <text class="tech-text text-pink" x="0" y="96" font-size="9">> SECURITY clearance A ... CLEAR</text>
      </g>
    </g>

    <!-- Clip path to hide overflow log text -->
    <clipPath id="log-mask">
      <rect x="0" y="0" width="205" height="100" />
    </clipPath>
  </g>

</svg>
